name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 4 hours (100% free via GitHub Actions)
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  keep_alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit Cloud Application
        run: |
          # Custom secret URL or fallback candidate URLs
          CUSTOM_URL="${{ secrets.STREAMLIT_APP_URL }}"
          
          if [ -n "$CUSTOM_URL" ]; then
            URLS=("$CUSTOM_URL")
          else
            URLS=(
              "https://esgrc.streamlit.app"
              "https://code0era-esgrc.streamlit.app"
            )
          fi

          for URL in "${URLS[@]}"; do
            echo "--------------------------------------------------"
            echo "Pinging: $URL"
            
            # -L follows redirects (crucial for Streamlit Cloud app wake-up)
            HTTP_STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" --max-time 45 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" "$URL")
            echo "Response Status Code: $HTTP_STATUS"
            
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
              echo "✅ App at $URL is awake and responding!"
            else
              echo "ℹ️ Returned status $HTTP_STATUS"
            fi
          done
