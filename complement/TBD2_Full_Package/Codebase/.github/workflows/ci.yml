name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_call:

jobs:
  # ── Job 1: ESGRC backend — must keep all tests green (258 as of 2026-09-10;
  #    counts move often, see README's status line for the current total) ────
  test-esgrc:
    name: ESGRC Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ESGRC/requirements.txt

      - name: Install ESGRC + pipeline dependencies
        # The ESGRC app mounts the pipeline + copilot routers (main.py), and the
        # test suite does `from main import app`, so importing the app pulls in
        # pipeline deps (celery, slowapi, boto3, pandas, ...). Install BOTH sets —
        # same as ESGRC/Dockerfile and the local .venv2. Installing only the
        # ESGRC set makes `from main import app` fail at collection time.
        run: pip install -r ESGRC/requirements.txt -r pipeline/requirements.txt

      - name: Run ESGRC tests
        env:
          DATABASE_URL: sqlite:///./.local/test_databases/test_esgrc.db
          SECRET_KEY: ci-test-secret-key-not-for-production-use
          AGENT_ENABLED: "false"
          LLM_AGENT_ENABLED: "false"
          # Never use real API key in CI — all LLM calls must be mocked
          ANTHROPIC_API_KEY: "sk-ant-ci-mock-key"
          PYTHONPATH: ${{ github.workspace }}/ESGRC
        run: |
          pytest ESGRC/tests/ -q --tb=short -W error \
            -W "ignore::starlette.exceptions.StarletteDeprecationWarning"
          echo "✅ ESGRC: all tests passed"

  # ── Job 2: Pipeline backend tests ─────────────────────────────────────────
  test-pipeline:
    name: Pipeline Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline + ESGRC dependencies
        # pipeline/tests/conftest.py puts ESGRC on sys.path and several tests do
        # `from app.dependencies.auth import ...` / `from app.models...`, which
        # need ESGRC-only deps (python-jose, bcrypt, apscheduler). Install BOTH
        # sets so the cross-imports resolve (same as the local .venv2).
        run: pip install -r pipeline/requirements.txt -r ESGRC/requirements.txt

      - name: Run pipeline tests
        env:
          DATABASE_URL: sqlite:///./.local/test_databases/test_pipeline.db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key-not-for-production-use
          ANTHROPIC_API_KEY: "sk-ant-ci-mock-key"
          CLOUDFLARE_R2_BUCKET: ci-test-bucket
          CLOUDFLARE_R2_ENDPOINT: https://ci-test.r2.example.com
          CLOUDFLARE_R2_ACCESS_KEY: ci-test-access-key
          CLOUDFLARE_R2_SECRET_KEY: ci-test-secret-key
          CELERY_TASK_ALWAYS_EAGER: "true"
          DEMO_MODE: "false"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest pipeline/tests/ -q --tb=short \
            --override-ini="asyncio_mode=auto" \
            --override-ini="asyncio_default_fixture_loop_scope=function" \
            -W error \
            -W "ignore::pytest.PytestDeprecationWarning" \
            -W "ignore::DeprecationWarning:celery" \
            -W "ignore::DeprecationWarning:kombu" \
            -W "ignore::PendingDeprecationWarning" \
            -W "ignore::starlette.exceptions.StarletteDeprecationWarning" \
            -W "ignore:The default datetime adapter is deprecated:DeprecationWarning"
          echo "✅ Pipeline: all tests passed"

  # ── Job 3: Frontend unit / component tests + type-check ───────────────────
  test-frontend:
    name: Frontend Tests (Vitest + tsc)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run Vitest (unit + component)
        run: npm test
      # Playwright E2E runs in the `e2e` job below, against a real stack. It
      # cannot run here: the specs log in as different users and assert on
      # role-dependent navigation, which MSW cannot reproduce because its login
      # handler returns a fixed user regardless of credentials.

  # ── Job 6: Playwright E2E against a real stack ─────────────────────────────
  # These specs were written against a real backend and were not run by
  # anything, so nothing caught UI regressions. The refresh-logout bug, fixed on
  # 5 Aug, was exactly the kind of failure they exist to find.
  #
  # No ANTHROPIC_API_KEY and no R2: the specs cover login, navigation and RBAC
  # only, so no pipeline is triggered and nothing is uploaded.
  e2e:
    name: Playwright E2E (real stack)
    runs-on: ubuntu-latest
    needs: [test-esgrc, test-frontend]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Write a CI .env for compose
        run: |
          cat > .env <<'ENVFILE'
          POSTGRES_PASSWORD=ci-postgres-password
          SECRET_KEY=ci-secret-key-not-for-production-use
          ANTHROPIC_API_KEY=sk-ant-ci-mock-key-unused-by-e2e
          CLOUDFLARE_R2_BUCKET=ci-bucket
          CLOUDFLARE_R2_ENDPOINT=https://ci.example.com
          CLOUDFLARE_R2_ACCESS_KEY=ci-access
          CLOUDFLARE_R2_SECRET_KEY=ci-secret
          DEMO_MODE=true
          AGENT_ENABLED=false
          ENVFILE

      - name: Start postgres, redis and the API
        # Only what the specs need. The frontend is served by vite below, not by
        # nginx, because Playwright's webServer owns it.
        run: docker compose -f docker-compose.yml up -d --build postgres redis esgrc_api

      - name: Wait for the API to be healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              echo "API healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::API never became healthy"
          docker compose -f docker-compose.yml logs esgrc_api | tail -50
          exit 1

      - name: Seed the demo organisation
        run: |
          docker compose -f docker-compose.yml exec -T esgrc_api \
            python pipeline/scripts/seed_demo.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Run Playwright
        working-directory: frontend
        env:
          # Point vite at the compose API and turn MSW OFF, mirroring the
          # frontend/.env.local that developers use locally. Without this the
          # dev server serves mocks and every RBAC assertion is meaningless.
          VITE_USE_MOCKS: "false"
          VITE_API_TARGET: http://localhost:8000
        run: npx playwright test --reporter=line

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7

      - name: API logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs esgrc_api | tail -100

  # ── Job 4: Docker image builds ─────────────────────────────────────────────
  # NOTE: both Dockerfiles COPY from repo-root paths (ESGRC/, pipeline/), so the
  # build context MUST be the repo root with an explicit `file:` — not ./ESGRC.
  build-images:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [test-esgrc, test-pipeline]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ESGRC API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ESGRC/Dockerfile
          push: false
          tags: tbd2-esgrc-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build pipeline worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: pipeline/Dockerfile
          push: false
          tags: tbd2-pipeline-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        # Added with the compose frontend service. Without this, a broken SPA
        # build only surfaces when someone runs `docker compose up`.
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: tbd2-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Hugging Face demo image
        # Dockerfile.hf is the real public-demo path and nothing verified it
        # still built. It is a multi-stage node + python image, so it breaks on
        # exactly the changes the other two images do not cover.
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.hf
          push: false
          tags: tbd2-hf:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 5: Deployment config validation ────────────────────────────────────
  # Neither compose files nor nginx configs were checked by anything. A typo in
  # either only surfaced at deploy time, on the one path that has no rollback.
  validate-deploy-config:
    name: Deploy Config Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Validate compose files parse (dev and prod merge)
        env:
          # config only interpolates; these never reach a running container.
          POSTGRES_PASSWORD: ci
          SECRET_KEY: ci
          ANTHROPIC_API_KEY: ci
          CLOUDFLARE_R2_BUCKET: ci
          CLOUDFLARE_R2_ENDPOINT: https://ci.example.com
          CLOUDFLARE_R2_ACCESS_KEY: ci
          CLOUDFLARE_R2_SECRET_KEY: ci
          REDIS_PASSWORD: ci
          ALLOWED_ORIGINS: https://ci.example.com
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.local.yml config -q
          echo "✅ compose: dev, prod and local all parse"

      - name: Validate nginx configs with nginx -t
        # `nginx -t` needs the referenced files to exist, so stub the TLS certs
        # and the document root. We are checking syntax and directive context,
        # not serving anything.
        #
        # --add-host is required, not cosmetic: nginx resolves `upstream` hosts
        # at PARSE time, so without it `nginx -t` dies with "host not found in
        # upstream esgrc_api:8000" before it validates a single directive. The
        # name only exists on the compose network. Pointing it at loopback lets
        # the parse complete; nothing is ever connected to.
        run: |
          mkdir -p nginx/certs nginx/certbot-www dist
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout nginx/certs/privkey.pem -out nginx/certs/fullchain.pem \
            -subj "/CN=localhost" 2>/dev/null
          for conf in nginx/nginx.conf nginx/nginx.prod.conf; do
            docker run --rm \
              --add-host esgrc_api:127.0.0.1 \
              -v "$PWD/$conf:/etc/nginx/nginx.conf:ro" \
              -v "$PWD/nginx/certs:/etc/nginx/certs:ro" \
              -v "$PWD/nginx/certbot-www:/var/www/certbot:ro" \
              -v "$PWD/dist:/usr/share/nginx/html:ro" \
              --entrypoint nginx nginx:alpine -t -c /etc/nginx/nginx.conf
            echo "✅ $conf is valid"
          done

      - name: Assert the SPA and /api routing is actually wired
        # A syntactically valid config can still be silently wrong. These are the
        # two mistakes that shipped before: no /api rewrite (so every API call
        # 404s) and no static root (so the SPA is never served).
        run: |
          for conf in nginx/nginx.conf nginx/nginx.prod.conf; do
            grep -q 'location /api/'                 "$conf" || { echo "::error::$conf has no /api location"; exit 1; }
            grep -q 'rewrite \^/api/(.\*)\$ /\$1 break' "$conf" || { echo "::error::$conf does not strip the /api prefix"; exit 1; }
            grep -q 'try_files \$uri \$uri/ /index.html' "$conf" || { echo "::error::$conf has no SPA fallback"; exit 1; }
            grep -q 'location = /health'             "$conf" || { echo "::error::$conf would serve index.html for /health"; exit 1; }
            echo "✅ $conf routes /api, serves the SPA, and keeps /health on the API"
          done
