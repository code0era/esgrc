events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    # Hide Nginx version from attackers
    server_tokens off;

    upstream esgrc_api {
        server esgrc_api:8000;
    }

    server {
        listen 80;
        server_name _;

        # ── Security headers (SEC-12) ──────────────────────────────────────
        # These apply to every response from this server block
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none';"
            always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ── Routing note ───────────────────────────────────────────────────
        # The frontend calls "/api/*" (frontend/src/lib/axios.ts sets
        # baseURL: '/api'), and nginx strips the prefix so it lands on the
        # backend's root routes (/auth, /pipelines, /copilot, ...). This mirrors
        # the vite dev proxy's rewrite and deploy/hf/nginx.conf.
        #
        # This block used to send "location /" straight to esgrc_api with no
        # /api prefix and no rewrite, and no frontend was served at all, so the
        # stack could not have served the SPA even once a container existed.

        # ── SSE — pipeline stream (buffering MUST be off) ─────────────────
        location ~ ^/api/pipelines/runs/[^/]+/stream {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass         http://esgrc_api;
            proxy_http_version 1.1;

            proxy_buffering            off;
            proxy_cache                off;
            add_header X-Accel-Buffering no;
            chunked_transfer_encoding  on;

            proxy_read_timeout  7200s;
            proxy_send_timeout  7200s;
            proxy_connect_timeout 60s;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        '';
        }

        # ── SSE — Co-Pilot stream ─────────────────────────────────────────
        location ~ ^/api/copilot/stream/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass         http://esgrc_api;
            proxy_http_version 1.1;

            proxy_buffering            off;
            proxy_cache                off;
            add_header X-Accel-Buffering no;
            chunked_transfer_encoding  on;

            proxy_read_timeout  300s;
            proxy_send_timeout  300s;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        '';
        }

        # ── All other API traffic ─────────────────────────────────────────
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass         http://esgrc_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_read_timeout  60s;
            client_max_body_size 50M;
        }

        # ── Health check ──────────────────────────────────────────────────
        # Stays at the root, unprefixed. Load balancers, container health
        # checks and the deploy smoke test in docs/deployment/PROD_DEPLOY.md all probe
        # /health; without this exact-match it would fall through to the SPA
        # and return index.html with a 200, which looks healthy while telling
        # you nothing about the backend.
        location = /health {
            proxy_pass         http://esgrc_api/health;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Static frontend (SPA) ─────────────────────────────────────────
        # Served from the frontend_dist volume that the `frontend` service
        # publishes. try_files falls back to index.html so client-side routes
        # (/dashboard, /pipelines, ...) survive a hard refresh.
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
