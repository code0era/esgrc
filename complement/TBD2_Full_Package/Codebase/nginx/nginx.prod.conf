events {
    worker_connections 1024;
}

# ─────────────────────────────────────────────────────────────────────────────
# PRODUCTION nginx config — TLS-terminating reverse proxy in front of esgrc_api.
#
# Differences from the dev nginx.conf:
#   • :80 redirects everything to :443 (except the ACME challenge path).
#   • :443 terminates TLS using certs mounted at /etc/nginx/certs.
#   • uvicorn is NEVER exposed directly — only nginx publishes ports in prod.
#
# Enable via docker-compose.prod.yml, which mounts this file to
# /etc/nginx/nginx.conf and the certs to /etc/nginx/certs. See docs/deployment/PROD_DEPLOY.md.
# Keep the location blocks below in sync with nginx.conf (dev).
# ─────────────────────────────────────────────────────────────────────────────

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    upstream esgrc_api {
        server esgrc_api:8000;
    }

    # ── TLS hardening ─────────────────────────────────────────────────────────
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── :80 — redirect to HTTPS (keep ACME challenge reachable) ───────────────
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── :443 — TLS termination + reverse proxy ────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # Certs are mounted read-only from ./nginx/certs (see compose). Replace
        # the self-signed dev certs with real ones (Let's Encrypt / your CA).
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # ── Security headers ──────────────────────────────────────────────────
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none';"
            always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # ── SSE — pipeline stream (buffering MUST be off) ─────────────────────
        location ~ ^/api/pipelines/runs/[^/]+/stream {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass         http://esgrc_api;
            proxy_http_version 1.1;
            proxy_buffering            off;
            proxy_cache                off;
            add_header X-Accel-Buffering no;
            chunked_transfer_encoding  on;
            proxy_read_timeout  7200s;
            proxy_send_timeout  7200s;
            proxy_connect_timeout 60s;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        '';
        }

        # ── SSE — Co-Pilot stream ─────────────────────────────────────────────
        location ~ ^/api/copilot/stream/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass         http://esgrc_api;
            proxy_http_version 1.1;
            proxy_buffering            off;
            proxy_cache                off;
            add_header X-Accel-Buffering no;
            chunked_transfer_encoding  on;
            proxy_read_timeout  300s;
            proxy_send_timeout  300s;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        '';
        }

        # ── All other API traffic ─────────────────────────────────────────────
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass         http://esgrc_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_read_timeout  60s;
            client_max_body_size 50M;
        }

        # ── Health check ──────────────────────────────────────────────────────
        # Stays at the root, unprefixed. Load balancers, container health checks
        # and the smoke table in docs/deployment/PROD_DEPLOY.md all probe /health; without
        # this exact-match it would fall through to the SPA and return
        # index.html with a 200, which looks healthy while proving nothing.
        location = /health {
            proxy_pass         http://esgrc_api/health;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Static frontend (SPA) ─────────────────────────────────────────────
        # Served from the frontend_dist volume published by the `frontend`
        # service. try_files falls back to index.html so client-side routes
        # survive a hard refresh.
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
