[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    error
    ignore::DeprecationWarning:celery
    ignore::DeprecationWarning:kombu
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestDeprecationWarning
    ignore::DeprecationWarning:pytest_asyncio
    # starlette 1.x TestClient warns to migrate off httpx to "httpx2", but that
    # package does not exist yet (July 2026) and anthropic pins httpx<1, so the
    # migration is not actionable. Suppress until httpx2 ships. Tracked as tech debt.
    ignore::starlette.exceptions.StarletteDeprecationWarning
    # Python 3.12 deprecated sqlite3's implicit datetime adapter. Only the sqlite
    # test/demo path hits it (prod uses Postgres via psycopg); the pipeline
    # conftest's raw datetime inserts trigger it. Safe to ignore in tests.
    ignore:The default datetime adapter is deprecated:DeprecationWarning
