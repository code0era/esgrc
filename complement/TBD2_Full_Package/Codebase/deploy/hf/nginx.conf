# nginx config for the single-container Hugging Face Spaces demo.
#
# One process serves BOTH the built React frontend (static files) and proxies
# API traffic to the uvicorn backend running on 127.0.0.1:8000 inside the same
# container. The frontend calls "/api/*" (see frontend/src/lib/axios.ts); nginx
# strips the "/api" prefix so it maps onto the backend's root routes
# (/auth, /pipelines, /copilot, ...), matching the vite dev-proxy rewrite.
#
# Runs as a NON-root user (HF runs containers as uid 1000), so: no `user`
# directive, pid + all temp paths under /tmp, and it listens on 7860 (HF's
# expected app port, declared in the Space README `app_port`).

worker_processes  1;
pid               /tmp/nginx.pid;
error_log         /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Non-root: keep every writable path under /tmp.
    client_body_temp_path /tmp/nginx_client;
    proxy_temp_path       /tmp/nginx_proxy;
    fastcgi_temp_path     /tmp/nginx_fastcgi;
    uwsgi_temp_path       /tmp/nginx_uwsgi;
    scgi_temp_path        /tmp/nginx_scgi;

    access_log  /dev/stdout;
    sendfile    on;
    keepalive_timeout 65;
    server_tokens off;

    upstream backend {
        server 127.0.0.1:8000;
    }

    server {
        listen 7860;
        server_name _;

        client_max_body_size 50M;

        # ── SSE: pipeline run stream — buffering MUST be off ──────────────
        # Browser hits /api/pipelines/runs/<id>/stream; strip /api -> backend.
        location ~ ^/api/pipelines/runs/[^/]+/stream {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_buffering            off;
            proxy_cache                off;
            add_header X-Accel-Buffering no;
            chunked_transfer_encoding  on;
            proxy_read_timeout  7200s;
            proxy_send_timeout  7200s;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        '';
        }

        # ── SSE: Co-Pilot stream — buffering MUST be off ─────────────────
        location ~ ^/api/copilot/stream/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_buffering            off;
            proxy_cache                off;
            add_header X-Accel-Buffering no;
            chunked_transfer_encoding  on;
            proxy_read_timeout  300s;
            proxy_send_timeout  300s;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        '';
        }

        # ── All other API traffic: strip /api, proxy to backend ──────────
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout  120s;
        }

        # ── Static frontend (SPA) ────────────────────────────────────────
        root /app/frontend_dist;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
